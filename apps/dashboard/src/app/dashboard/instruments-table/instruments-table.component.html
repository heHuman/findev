<div class="table">
  <div class="header">
    <div class="row">
      <div class="cell">Instrument</div>
      <div class="cell">Last price</div>
      <div class="cell">Spread</div>
      <div class="cell">Volume</div>
      <div class="cell">VWAP</div>
      <div class="cell">Imbalance</div>
    </div>
  </div>

  <cdk-virtual-scroll-viewport
    class="body"
    [itemSize]="rowHeight"
    [minBufferPx]="minBufferPx"
    [maxBufferPx]="maxBufferPx"
    [style.height.px]="bodyHeight()"
  >
    <div *cdkVirtualFor="let row of rows(); trackBy: trackByTicker" class="row">
      <div class="cell ticker">{{ row.ticker }}</div>
      <div class="cell">{{ row.lastPriceCents | price }}</div>
      <div class="cell">{{ row.spreadCents | price }}</div>
      <div class="cell">{{ row.cumulativeVolume | number }}</div>
      <div class="cell">{{ row.vwapCents | price }}</div>
      <div class="cell">{{ row.imbalance | imbalance }}</div>
    </div>
  </cdk-virtual-scroll-viewport>
</div>
